# gem-agent configuration
# Copy to ~/.config/gem-agent/config.toml and adjust values.
#
# Precedence: command-line flags > GEMAGENT_* > GOOGLE_CLOUD_* > this
# file > built-in defaults. Unknown keys are rejected, so a typo fails
# loudly at startup instead of being silently ignored.

[gcp]
# Google Cloud project with Vertex AI enabled. Required.
# Also settable via GEMAGENT_PROJECT or GOOGLE_CLOUD_PROJECT.
project = "your-project-id"

# Vertex AI endpoint location. "global" is the default. The Gemini 3
# family is served from "global" and the "us" / "eu" multi-regions
# only ("eu" per the Vertex model page) — single regions return 404
# for those models (measured:
# gemini-3.8-flash and gemini-3.7-flash answer from "global" and "us",
# "us-central1" 404s). Use a single region (e.g. "us-central1") only
# for Gemini 2.5 models.
location = "global"

# GCS bucket for audio/video attachments (ADR-0027). When set, attached
# media ALWAYS routes through this bucket as gs:// URIs (Vertex reads
# them natively) — inline media bytes would be re-sent with every round's
# history replay, so one upload beats many resends. Uploads are
# content-addressed under gem-agent/media/ and never deleted by
# gem-agent; set a bucket lifecycle rule (e.g. delete after 7 days) for
# retention. When unset, media attaches inline up to 15MB.
#bucket = "your-bucket-name"

[model]
# Gemini model ID. Required, and deliberately without a built-in
# default: model IDs churn, and a stale hardcoded one fails at runtime.
name = "gemini-3.8-flash"

# Context window shown in the status line. Optional — Vertex does not
# report inputTokenLimit, so gem-agent falls back to the Gemini-family
# 1M estimate (displayed as "~1.0M"). Set this for an exact figure.
#context_window = 1048576

# Lightweight model for the summarize_file tool (ADR-0014). Unset means
# the main model — the context saving does not depend on the model being
# cheaper. Shares the main model's client, project, and credentials.
# Prefer a GA model over a preview here: a fallback tool's parts should
# not disappear on a preview's schedule.
#summary = "gemini-3.5-flash-lite"

# Content-filter policy for the four configurable harm categories:
#   default — the provider's own thresholds
#   relaxed — block only high-confidence hits
#   off     — do not block on those categories
# Security work trips the dangerous-content filter on ordinary material
# (an incident-response runbook, a phishing analysis); gem-agent reports
# such a block explicitly, naming this setting. Loosening it is a
# deliberate choice, so the default is left alone. Note that some Vertex
# filters cannot be turned off at any setting.
#safety = "default"

# Gemini 3 thinking level for main-model calls (ADR-0025):
#   minimal | low | medium | high
# Unset means the model's own default. Thought tokens are billed and
# shown in the footer and /usage; lower levels answer faster and
# cheaper, higher levels reason more (measured on one arithmetic prompt:
# low 93 / medium 170 / high 222 thought tokens). Which levels a model
# accepts is model-dependent — gemini-3.7-flash and gemini-3.8-flash
# reject "minimal" with a clear 400 on the first turn (measured; both
# accept low/medium/high, medium being their default). The
# summarize_file model is
# not affected. The --thinking flag overrides this per run.
#thinking = "high"

[sandbox]
# Wrap shell_exec in macOS sandbox-exec (ADR-0001, ADR-0073): the lane
# the model declares — read, write or operator — is enforced by the
# kernel. Leave enabled unless you are debugging the sandbox itself;
# with it off every shell_exec is yours to approve — no policy or auto
# mode lifts that.
enabled = true
# Programs the read lane may not launch, added to the built-in list
# (osascript, open, launchctl, defaults, security, pbcopy, shortcuts,
# automator, scutil, networksetup, systemsetup). Names or absolute paths.
#read_lane_deny_exec = ["docker", "/usr/local/bin/terraform"]
# Keep the approval prompt for read-lane commands too (the kernel cage
# still applies; only "runs unasked" is given up).
#read_lane_prompts = false

[agent]
# Round budget for one turn. Reaching it is an intervention, not a
# guillotine (ADR-0040): a progress review runs, the operator is asked
# (auto-approve mode continues by itself on a confident "progressing"
# verdict), and extensions are granted up to a hard cap of 3× this
# value that no verdict can lift. A loop detector escalates three
# identical consecutive calls immediately, without waiting for the
# limit.
max_turns = 50

# Per-command timeout for shell_exec, in seconds.
shell_timeout_sec = 120

# Start sessions with auto-approve on (ADR-0004). Off by default:
# weakening the approval gate should be a deliberate choice. Toggle at
# runtime with shift+tab or /auto regardless of this setting.
auto_approve = false

# Summarise the older part of the conversation when the context window
# fills, instead of failing the turn (ADR-0006). On by default: this
# weakens no defense, and a session that dies at the window is not much
# of a fallback. /compact does it by hand at any time.
auto_compact = true

# Share of the model's input window at which compaction fires. The
# window comes from [model].context_window, or the family estimate.
compact_at_pct = 80

[approval]
# Trust is given to content (ADR-0074): a trusted project's agent-facing
# files are pinned by digest, and a changed one asks again before it is
# loaded. false restores directory-only trust.
#pin_trusted_files = true
# Per-tool approval policy (ADR-0008). Two values:
#   "always" — always ask, in every mode (an operator-set floor that
#              auto-approve cannot lift)
#   "never"  — never ask, in every mode. For a tool whose effect varies
#              per call (shell_exec), the rule tier's blocked patterns
#              (rm -rf, sudo, curl|sh, credential paths, out-of-project
#              writes) still ask — "never" is not "run anything".
# Unset means today's behaviour: mutating tools ask; auto-approve runs
# them through its two-tier ladder.
#
# The main use: every MCP tool asks on every call, because gem-agent
# cannot know what a server's tool does. You do. A trailing "*" matches a
# whole server, which is usually what you want for a read-only lookup.
#[approval.tools]
#"mcp__tor-exit-lookup__*" = "never"
#"shell_exec"              = "always"

# Project directories you trust completely. This is NOT approval-only:
# a listed project's .gem-agent.toml may REMOVE approvals, AND its
# .mcp.json servers are spawned, its .claude/skills are discovered, and
# its instruction files are read. It is the same decision as answering
# yes to the startup trust prompt. Everywhere else a project file may
# only ADD approvals: a checked-out repository is not necessarily
# something you wrote, and it must not be able to switch the gate off.
# Ignored entries are reported at startup.
#trusted_projects = ["/Users/you/works/your-repo"]

# Operator pre-tool hooks (ADR-0044). Each entry runs `command` via
# sh -c before every model tool call whose name `matcher` covers
# (exact, "a|b", or "*"; Claude Code names like "Bash" also match
# their gem-agent equivalents). The command receives Claude Code's
# PreToolUse JSON on stdin and denies via the same contracts
# (hookSpecificOutput.permissionDecision "deny", or exit code 2 with
# the reason on stderr) — so a Claude Code guard script works
# unchanged. A deny is final: neither auto-approve nor the session
# allowlist can override it, and the reason is returned to the model.
# Anything else (crash, timeout, unparseable output) proceeds with a
# warning: hooks only ever tighten. Global config only — a project
# hook would let a cloned repo run arbitrary commands.
# `matcher` does the matching (a tool name, "a|b", or "*"); `command`
# is what runs — a shell line via sh -c, so arguments and flags work.
#[[hooks.pre_tool_use]]
#matcher = "shell_exec"
#command = "python3 /Users/you/.claude/hooks/guard-recursive-write.py"
#timeout_sec = 10

# Context hooks (ADR-0069) — the same contract as Claude Code's
# SessionStart and UserPromptSubmit hooks, measured. A session_start
# hook runs when a session starts (source "startup" or "resume") and on
# /clear (source "clear"); `matcher` is optional and selects the source.
# A user_prompt_submit hook runs on every prompt and takes no matcher.
# Both receive the event's JSON on stdin (session_id, transcript_path,
# cwd, and source / prompt) and inject context by printing it: plain
# text, or JSON with hookSpecificOutput.additionalContext. Injected
# text rides the next turn as DATA — beside what you typed, nonce-
# wrapped like piped stdin, never in the system prompt and never in
# the instruction channel the risk reviewer trusts. A user_prompt_submit
# hook may refuse the prompt (exit 2 with the reason on stderr, or the
# JSON block forms); a session start cannot be blocked. Output is
# capped at 8000 runes per hook; crashes and timeouts inject nothing
# and warn. Global config only, like pre_tool_use.
#[[hooks.session_start]]
#command = "/Users/you/hooks/session-context.sh"
#timeout_sec = 10
#[[hooks.user_prompt_submit]]
#command = "/Users/you/hooks/turn-context.sh"
#timeout_sec = 10
# A session_end hook runs when the session ends (reason "exit") and when
# /clear closes the old session (reason "clear"); it cannot block and its
# output is ignored (ADR-0071).
#[[hooks.session_end]]
#command = "/Users/you/hooks/session-end.sh"
#timeout_sec = 10

[mcp]
# Connect MCP servers declared in ~/.config/gem-agent/mcp.json (global)
# and <project>/.mcp.json (project; wins name collisions). The project
# file is read only in a trusted project — an untrusted one contributes
# no servers at all (ADR-0023). Both files
# use the Claude Code format — see mcp.example.json. The --mcp flag
# overrides this per run (on|off — "off" skips every server spawn,
# what a -p pipeline usually wants); /mcp reload reconnects servers
# mid-session (ADR-0039).
enabled = true

# Per-call timeout for MCP tools, in seconds. On timeout the server
# child is killed and respawned on the next call (MCP has no cancel).
call_timeout_sec = 60

[tui]
# Interactive UI theme: "auto" detects the terminal background at
# startup, "dark"/"light" force it when detection guesses wrong, and
# "plain" disables all styling for terminal themes that fight colors.
theme = "auto"

# UI language for help, hints, prompts, and the approval dialog:
# "auto" follows LC_ALL / LC_MESSAGES / LANG (a "ja" prefix selects
# Japanese, anything else English); "ja" and "en" force it.
# Applies at the next start.
language = "auto"

# Stream the model's thought summaries into the live area while it
# thinks (ADR-0033). Display-only: thoughts are never written to the
# transcript. false restores the quiet spinner; the stream heartbeat
# and retry visibility stay either way.
show_thoughts = true

[telemetry]
# Audit logging (ADR-0035). Default OFF. When enabled, audit events
# (sessions, tool calls with outcomes, approval decisions, token
# usage) are exported — METADATA only: prompts, responses, file
# contents and thoughts never leave the machine through this channel.
# Only THIS file can enable telemetry or choose where it goes; a
# project's .gem-agent.toml cannot.
#
# backend "gcp" (default) writes to Cloud Logging of [gcp].project —
# same ADC as Vertex, zero collector infrastructure, log name
# "gem-agent" in the Logs Explorer. Needs logging.googleapis.com
# enabled and roles/logging.logWriter.
# backends "otlp-grpc" / "otlp-http" send OpenTelemetry log records to
# the endpoint below. Auth headers come from headers_file — a
# mode-0600 JSON file of header name → value; a file survives
# launchd/cron/fresh shells where an environment variable does not
# (OTEL_EXPORTER_OTLP_HEADERS still works when unset).
enabled = false
backend = "gcp"            # gcp | otlp-grpc | otlp-http
endpoint = "localhost:4317" # otlp-* only
insecure = false            # otlp-* only: plaintext for a local collector
#headers_file = "~/.config/gem-agent/auth.json"  # otlp-* auth headers, mode 0600
